name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: build / vet / fmt / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            echo "Run: gofmt -w ."
            exit 1
          fi

      - name: Test
        run: go test ./...

  integration:
    name: integration (terraform init/plan/apply)
    runs-on: ubuntu-latest
    env:
      TERRAFORM_VERSION: 1.15.9
      TERRAFORM_SHA256: 76edd0b22d2f27d3d2e097cd793209646f719cf60f02ff3af626b07361137da1
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install pinned Terraform
        run: |
          zip="terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          curl -fsSLo "$RUNNER_TEMP/$zip" "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/$zip"
          echo "$TERRAFORM_SHA256  $RUNNER_TEMP/$zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          unzip -q "$RUNNER_TEMP/$zip" -d "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Integration test
        run: |
          terraform version
          go test -tags integration -run Integration -v ./internal/terraform

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2

  macos:
    name: test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

  goreleaser:
    name: goreleaser check and snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Check config
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check

      - name: Snapshot build
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean
