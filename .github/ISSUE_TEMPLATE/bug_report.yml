name: Bug report
description: Something LazyTF does wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The directory layout helps (file names only, no secrets).
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: LazyTF version
      description: Output of `lazytf --version`
    validations:
      required: true
  - type: input
    id: terraform
    attributes:
      label: Terraform or OpenTofu version
      description: Output of `terraform version`
  - type: input
    id: os
    attributes:
      label: OS and terminal
  - type: textarea
    id: config
    attributes:
      label: Config
      description: Your `.lazytf.yml` or `config.yml`, if you have one. Remove anything private.
      render: yaml
